# InternFlow backend - base application configuration.
#
# All environment-specific values are supplied through environment variables so
# that credentials and local settings stay outside tracked source files
# (NFR-SEC-008). Defaults below are safe local placeholders only.
#
# Stage 3.1 introduces the first versioned schema migration for the Stage 3 core
# tables (users, cohorts, memberships, faculty assignments, companies,
# internships). Later tables remain deferred while OD-02/OD-03/etc. are open;
# see docs/architecture/DDD.md section 15 and IF-DEC-20.

spring:
  application:
    name: internflow-backend
  # No authentication mechanism exists yet (OD-15 is open). Disable Spring Boot's
  # default in-memory user so the application does not appear to offer a login.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${INTERNFLOW_DB_URL:jdbc:postgresql://localhost:5432/internflow}
    username: ${INTERNFLOW_DB_USERNAME:internflow}
    password: ${INTERNFLOW_DB_PASSWORD:}
  flyway:
    # Versioned migrations are the only schema authority (IF-DEC-20). A live
    # PostgreSQL database is therefore required to start the application.
    # Tests disable this via the Maven Surefire system property.
    enabled: ${INTERNFLOW_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  jpa:
    # Hibernate never creates or alters the schema. Entity mappings will use
    # validate once Stage 3 entities exist.
    hibernate:
      ddl-auto: ${INTERNFLOW_JPA_DDL_AUTO:none}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
