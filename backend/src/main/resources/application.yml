# InternFlow backend - base application configuration.
#
# All environment-specific values are supplied through environment variables so
# that credentials and local settings stay outside tracked source files
# (NFR-SEC-008). Defaults below are safe local placeholders only.
#
# No database migrations and no JPA entities exist yet: the database design
# (docs/architecture/DDD.md) is still a draft and several schema decisions
# (OD-02, OD-03 and others) are unresolved.

spring:
  application:
    name: internflow-backend
  # No authentication mechanism exists yet (OD-15 is open). Disable Spring Boot's
  # default in-memory user so the application does not appear to offer a login.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${INTERNFLOW_DB_URL:jdbc:postgresql://localhost:5432/internflow}
    username: ${INTERNFLOW_DB_USERNAME:internflow}
    password: ${INTERNFLOW_DB_PASSWORD:}
  jpa:
    # No entities exist yet. "none" keeps Hibernate from touching the database;
    # revisit together with the schema design (IF-DEC-06).
    hibernate:
      ddl-auto: ${INTERNFLOW_JPA_DDL_AUTO:none}
    # Specified explicitly so the application context can start without a live
    # database connection (useful before PostgreSQL is provisioned).
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
